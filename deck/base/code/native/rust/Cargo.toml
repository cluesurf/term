# Base libraries the Seed stdlib's rust target wraps. The framework logic is ours and uniform; these are the
# production crates the native shims (native/rust/runtime/*.rs) delegate to. An app compiled for rust depends on these.
#
# The async surface is the ecosystem-standard stack and not a hand-rolled one: tokio for the runtime, `tokio::fs`
# for asynchronous filesystem work, hyper (over hyper-util / http-body-util) for the HTTP server, and
# tokio-rustls for its TLS. See note/project/term/stdlib/native-async-file-and-server.md.
[package]
name = "term-rust-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
# keyed `md5`, its library's own name, because a program's crates are found by the `<key>::` its source names
# (compile/main-entry.tree crates-named): keyed `md-5` it was looked for as `md_5::`, so a program reaching the crypto
# runtime (runtime/crypto.rs, `::md5::Md5`) was built without it and failed E0433 (found by item 0438, 2026-10-30)
md5 = { package = "md-5", version = "0.10" }
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"
rand = "0.8"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
# the cask's update client verifies a manifest's RSASSA-PKCS1-v1_5 signature (deck/cask/code/native/rust/runtime/cask-update.rs)
rsa = { version = "0.9", features = ["sha2"] }
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# integer/big's arithmetic, and so decimal, float/128, float/big and integer/128 on Rust. It was named by their binds
# and missing here until 2026-10-05, so no Rust build of them could get it
num-bigint = "0.4"
# text/unicode's NFC, NFD, NFKC and NFKD on Rust (`unicode_normalization::UnicodeNormalization`), which url.tree's host
# parser reaches. Named by unicode.tree's binds and missing here until 2026-10-21, so no Rust build of url could get it
unicode-normalization = "0.1"

# the asynchronous filesystem and HTTP server stack
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = "0.26"
rustls-pemfile = "2"
notify = "7"
libc = "0.2"

[lib]
path = "lib.rs"
