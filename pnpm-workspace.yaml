allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
# Advisory floors. Each is the lowest release that carries the fix for
# the advisory named beside it, so raising one is safe and lowering one
# is not. `pnpm audit:safe --root .` from the repo root is what checks
# them against the lockfile.
overrides:
  vite: ^7.3.5
  # GHSA-82fw-gwwq-j7x9, path traversal and arbitrary file read through
  # the mocker's redirect mock. vitest pulls its own matching mocker so
  # both are pinned. The 4.x fix is 4.1.11, and it stays on vite 7:
  # vitest 4.1.11's real peer range is `^6.0.0 || ^7.0.0 || ^8.0.0`, so
  # this costs no major.
  vitest: ^4.1.11
  '@vitest/mocker': ^4.1.11
  esbuild: ^0.28.1
  # GHSA-fxqj-rqcc-2cmp, the incomplete fix for sourceMappingURL file
  # reads. ^8.5.18 admitted 8.5.19 through 8.5.22, which still carry it.
  # The lockfile here already held 8.5.25, so this only closes the floor.
  postcss: ^8.5.23
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  shell-quote: ^1.9.0
  braces: ^3.0.3
  flatted: ^3.4.2
  # GHSA-2883-xcg3-v3hh. Raised from ^4.3.0, which still admitted the
  # vulnerable 4.3.1 the lockfile was holding.
  js-yaml: ^4.3.2
  # GHSA-2v37-7h3g-55p8, a custom generator loops forever on size zero.
  # Scoped to the 3.x line: 4.x and later are ESM-only and the consumer
  # here reaches nanoid through a CommonJS path, so an unscoped range
  # would break the build rather than patch it. The 3.x fix is 3.3.18.
  'nanoid@3': ^3.3.18
  # GHSA-p498-v437-472g, a recursive copy follows symlinks out of the
  # source tree. Pulled in by eslint. Fixed in 0.16.8, which the lockfile
  # already held, so this only closes the floor.
  '@humanfs/node': ^0.16.8
  minimatch@3: ^3.1.3
  lodash: ^4.18.0
  ws: ^8.21.0
  # GHSA-5jgf-p345-68v8 and three siblings, SSRF and host confusion.
  # Nothing in the tree pulls fast-uri today so this floor is inert, but
  # ^3.1.4 admitted the vulnerable 3.1.4 and 3.1.5 the moment something
  # did. The 3.x fix is 3.1.6.
  fast-uri: ^3.1.6
  linkify-it: ^5.0.2
  # GHSA-crvj-82cr-hjcx, GHSA-g6gw-c38x-mqfc, GHSA-gqvv-2mrq-wpjv: the
  # query parser reading past the URL fragment, unbounded dot-notation
  # nesting in parseBody(), and toSSG() still escaping its output
  # directory. All three are fixed in 4.13.5.
  hono: ^4.13.5
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@3: ^5.0.7
  brace-expansion@4: ^5.0.7
